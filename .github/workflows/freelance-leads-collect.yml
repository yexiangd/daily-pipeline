name: Freelance leads collect

on:
  schedule:
    # Monday 13:37 UTC = 06:37 PDT — 1.5h before the Muse weekly scan (Mon 08:00 PT)
    - cron: '37 13 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r freelance-leads/requirements.txt

      - name: Collect HN + funding leads
        run: python freelance-leads/scripts/collect.py

      - name: Commit data
        run: |
          git config user.name "pipeline-bot"
          git config user.email "pipeline-bot@users.noreply.github.com"
          git add freelance-leads/data/
          git diff --cached --quiet || git commit -m "freelance leads $(date -u +%F)"
          git push
